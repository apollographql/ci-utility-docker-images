name: Build & Publish Docker Images - Daily

on:
  schedule:
    - cron: "0 10 * * *" # Run every day at 10am UTC to pick up upstream base-image updates
  workflow_dispatch: {}

jobs:
  find-all-docker-images:
    name: Find All Docker Images To Build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build_matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Build image matrix
        id: build_matrix
        run: |
          MATRIX=$(./.github/scripts/build_image_matrix.sh --all --tags=daily)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  pipeline:
    name: Image Pipeline
    needs: find-all-docker-images
    uses: ./.github/workflows/_image_pipeline.yml
    with:
      matrix: ${{ needs.find-all-docker-images.outputs.matrix }}
      do_release: true
    secrets: inherit